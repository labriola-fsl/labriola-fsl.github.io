<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diario di bordo PCTO</title>
<meta name="description" content="Diario di bordo della formazione scuola-lavoro (ex PCTO): ore, esperienze, relazione finale e foglio presenze.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: quaderno a quadretti. Testata su carta quadrettata, schede sticky, colonna unica; le giornate e le esperienze si aprono in un foglio dal basso. Le pagine della relazione sono a righe. */
:root{
  --paper:#F5F6FA; --surface:#FFFFFF; --surface-2:#EEF1F7; --line:#DCE1EC; --line-2:#C7CEDF;
  --grid:rgba(37,71,201,.085); --rule:rgba(37,71,201,.13);
  --ink:#141C33; --ink-2:#47526F; --ink-3:#737C9B;
  --pen:#2547C9; --pen-2:#1B37A3; --pen-soft:#E4EAFC; --on-pen:#FFFFFF;
  --red:#C2362B; --red-soft:#FBE6E3; --on-red:#FFFFFF;
  --green:#1D7A4C; --green-soft:#E1F2E8;
  --amber:#995A00; --amber-soft:#FBEED6;
  --p0:#2547C9; --p1:#C2571A; --p2:#009488; --p3:#7E3FC2; --p4:#4A8A12; --p5:#C4306F;
  --scrim:rgba(14,20,40,.42);
  --tip-bg:#141C33; --tip-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(20,28,51,.06),0 10px 28px rgba(20,28,51,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1220; --surface:#161B2C; --surface-2:#1E2438; --line:#2A3149; --line-2:#3A4260;
    --grid:rgba(138,160,255,.07); --rule:rgba(138,160,255,.12);
    --ink:#E8EBF5; --ink-2:#AEB5CC; --ink-3:#848DA9;
    --pen:#8AA0FF; --pen-2:#A9B9FF; --pen-soft:#232C52; --on-pen:#0E1220;
    --red:#FF8A7A; --red-soft:#3A1E1D; --on-red:#1A0B0A;
    --green:#6FD19B; --green-soft:#16301F;
    --amber:#F2B45A; --amber-soft:#35270F;
    --p0:#6A84EE; --p1:#D27A3A; --p2:#14A091; --p3:#9A70DE; --p4:#6E9F36; --p5:#D8628E;
    --scrim:rgba(0,0,0,.6);
    --tip-bg:#E8EBF5; --tip-fg:#0E1220;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1220; --surface:#161B2C; --surface-2:#1E2438; --line:#2A3149; --line-2:#3A4260;
  --grid:rgba(138,160,255,.07); --rule:rgba(138,160,255,.12);
  --ink:#E8EBF5; --ink-2:#AEB5CC; --ink-3:#848DA9;
  --pen:#8AA0FF; --pen-2:#A9B9FF; --pen-soft:#232C52; --on-pen:#0E1220;
  --red:#FF8A7A; --red-soft:#3A1E1D; --on-red:#1A0B0A;
  --green:#6FD19B; --green-soft:#16301F;
  --amber:#F2B45A; --amber-soft:#35270F;
  --p0:#6A84EE; --p1:#D27A3A; --p2:#14A091; --p3:#9A70DE; --p4:#6E9F36; --p5:#D8628E;
  --scrim:rgba(0,0,0,.6);
  --tip-bg:#E8EBF5; --tip-fg:#0E1220;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pen)}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.grow{flex:1 1 auto}
.quad{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;background-position:-1px -1px}

/* testata */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 16px}
.brand{min-width:0}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pen)}
h1{margin:4px 0 2px;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,42px);line-height:1.02;letter-spacing:-.015em;font-variation-settings:"opsz" 72}
.who{margin:0;color:var(--ink-2);font-size:15px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 10px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.chips-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.acct{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;max-width:100%;min-width:0}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct b{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.status[data-k="cloud"] i{background:var(--green)}
.status[data-k="saving"] i{background:var(--amber)}
.status[data-k="local"] i{background:var(--pen)}
.status[data-k="volatile"] i,.status[data-k="offline"] i{background:var(--red)}
.status[data-k="demo"] i{background:var(--p3)}

/* schede */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:block;padding:13px 12px 10px;font-weight:700;font-size:15px;color:var(--ink-2);text-decoration:none;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--pen);border-bottom-color:var(--pen)}

.banner{background:var(--pen-soft);border-bottom:1px solid var(--line)}
.banner .wrap{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:10px;font-size:14.5px}

main.wrap{padding-block:20px 116px;display:grid;gap:16px}

/* elementi base */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.h2{margin:0 0 12px;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;text-wrap:balance}
.h2-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.h2-row .h2{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primary:hover{background:var(--pen-2);border-color:var(--pen-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pen)}
.btn.ghost:hover{background:var(--pen-soft)}
.btn.small{min-height:34px;padding:0 11px;font-size:13.5px}
.btn.danger{color:var(--red);border-color:var(--line-2)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ai-only{display:none!important}
.has-ai .ai-only{display:inline-flex!important}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;line-height:1.3;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill{display:inline-block;font-size:12px;font-weight:700;line-height:1.3;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.todo{color:var(--amber);background:var(--amber-soft)}
.pill.ok{color:var(--green);background:var(--green-soft)}
.pill.off{color:var(--ink-2);background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-3));flex:none}
.c0{--c:var(--p0)}.c1{--c:var(--p1)}.c2{--c:var(--p2)}.c3{--c:var(--p3)}.c4{--c:var(--p4)}.c5{--c:var(--p5)}.cx{--c:var(--ink-3)}
.stamp{font-family:var(--f-hand);font-weight:600;font-size:19px;line-height:1;color:var(--green);border:1.5px solid currentColor;border-radius:6px;padding:2px 8px 1px;transform:rotate(-4deg);letter-spacing:.02em;white-space:nowrap}
.notice{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14.5px;color:var(--ink-2)}
.notice p{margin:0 0 6px}.notice p:last-child{margin:0}
.notice b{color:var(--ink)}

/* avanzamento */
.progress{border:1px solid var(--line-2);border-radius:16px;padding:20px 18px 16px;display:grid;gap:14px}
.pg-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.pg-num{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(46px,13vw,68px);line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pg-num small{font-size:.36em;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.pg-side{display:grid;gap:2px;max-width:34ch}
.pg-rem{margin:0;font-size:18px;font-weight:700}
.pg-rem.done{color:var(--green)}
.segbar{position:relative;height:16px}
.seg-in{display:flex;gap:2px;height:100%;background:var(--surface-2);border-radius:4px;overflow:hidden}
.seg-in span{height:100%;flex:none}
.segbar .goal{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:7px}
.legend b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.sw{width:11px;height:11px;border-radius:3px;background:var(--c)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.2}
.kpi span{font-size:13px;color:var(--ink-2)}
.kpi.warn b{color:var(--amber)}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* grafico mensile */
.mplot{position:relative;height:150px;margin:20px 0 0 30px;border-bottom:1px solid var(--line-2)}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.gl span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:11px;color:var(--ink-3)}
.mbars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:4px}
.mcol{position:relative;flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;outline:none}
.mcol:focus-visible .mbar{outline:2.5px solid var(--pen);outline-offset:2px}
.mbar{width:100%;max-width:30px;background:var(--p0);border-radius:4px 4px 0 0;flex-shrink:0}
.mmax{font-size:11px;color:var(--ink-2);margin-bottom:3px;flex-shrink:0}
.mtip{position:absolute;left:50%;bottom:calc(var(--bh) + 6px);transform:translateX(-50%);white-space:nowrap;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;z-index:3;transition:opacity .12s}
.mcol.edge-l .mtip{left:0;transform:none}
.mcol.edge-r .mtip{left:auto;right:0;transform:none}
.mcol:hover .mtip,.mcol:focus .mtip{opacity:1}
.mlabels{display:flex;gap:4px;margin:6px 0 0 30px}
.mlabels span{flex:1 1 0;min-width:0;text-align:center;font-size:11px;color:var(--ink-3);line-height:1.25}
.mlabels i{display:block;font-style:normal;font-size:10px}

/* barre orizzontali */
.bars{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px;align-items:baseline}
.bars .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .val{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.track span{display:block;height:100%;background:var(--c,var(--p0));border-radius:4px}
.pl{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.pl li{display:grid;gap:5px}
.pl .row{display:flex;align-items:center;gap:8px;min-width:0;font-size:14.5px}
.pl .row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl .row .h{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);white-space:nowrap}

/* da sistemare */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.todo li:first-child{border-top:0;padding-top:2px}
.todo .mk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.mk.warn{background:var(--amber-soft);color:var(--amber)}
.mk.ok{background:var(--green-soft);color:var(--green)}
.todo .t{flex:1;min-width:0}

/* giornate */
.entries{display:grid;gap:8px}
.entry{display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 8px;cursor:pointer;color:var(--ink)}
.entry:hover{border-color:var(--line-2)}
.e-date{display:flex;flex-direction:column;align-items:center;padding-top:2px;border-right:1px dashed var(--line-2);padding-right:8px}
.e-day{font-size:22px;font-weight:500;line-height:1.05}
.e-wd,.e-mon{font-size:12px;color:var(--ink-3);line-height:1.3}
.e-body{display:grid;gap:4px;min-width:0}
.e-top{display:flex;align-items:center;gap:8px;min-width:0}
.e-proj{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-h{font-size:15px;font-weight:500;white-space:nowrap}
.e-meta{font-size:13px;color:var(--ink-3)}
.e-text{font-size:14.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.e-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:3px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:10px 4px 2px;font-weight:700;font-size:15px}
.mhead:first-child{margin-top:0}
.mhead span:first-letter{text-transform:uppercase}
.mhead .mono{font-weight:500;font-size:13px;color:var(--ink-2)}

/* barra filtri */
.toolbar{display:grid;gap:10px}
.tb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tb-row select,.tb-row .search{flex:1 1 180px;min-width:0}
.tb-sum{font-size:13.5px;color:var(--ink-2)}

/* moduli */
.field{display:grid;gap:6px;min-width:0;margin:0;padding:0;border:0}
.field>span,.field legend,.flabel{font-size:13.5px;font-weight:700;color:var(--ink-2);padding:0}
.field legend{margin-bottom:6px}
.field-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.in{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
select.in{padding-right:30px}
textarea.in{min-height:84px;resize:vertical;line-height:1.5}
.in:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hint{margin:0;font-size:13.5px;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segopt{position:relative;display:inline-flex}
.segopt input{position:absolute;opacity:0;width:1px;height:1px}
.segopt span{display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.segopt input:checked+span{background:var(--pen-soft);color:var(--pen);border-color:var(--pen)}
.segopt input:focus-visible+span{outline:2.5px solid var(--pen);outline-offset:2px}
.tchip{min-height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:700;cursor:pointer}
.tchip[aria-pressed="true"]{background:var(--pen-soft);color:var(--pen);border-color:var(--pen)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.addc{display:flex;gap:8px}
.addc .in{min-height:38px;padding:6px 10px;font-size:15px}
.voto{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.vbtn{display:grid;gap:1px;justify-items:center;padding:8px 2px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--ink)}
.vbtn b{font-family:var(--f-mono);font-size:18px;font-weight:500}
.vbtn span{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.2}
.vbtn[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.vbtn[aria-pressed="true"] b{color:var(--pen)}
.check{display:flex;align-items:flex-start;gap:10px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--pen);flex:none}
.calc{margin:-6px 0 0;font-size:13.5px;color:var(--ink-2)}
.form-err{margin:0;padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:14px;font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swopt{position:relative}
.swopt input{position:absolute;opacity:0;width:1px;height:1px}
.swopt span{display:block;width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);cursor:pointer}
.swopt input:checked+span{box-shadow:0 0 0 2.5px var(--ink)}
.swopt input:focus-visible+span{outline:2.5px solid var(--pen);outline-offset:3px}

function entryRow(e,pmap,showMonth){
  const p=pmap.get(e.projectId);const d=toD(e.data);
  const wd=d.toLocaleDateString("it-IT",{weekday:"short"}).replace(".","");
  const mon=d.toLocaleDateString("it-IT",{month:"short"}).replace(".","");
  const comps=e.competenze||[];
  const time=e.inizio&&e.fine?`${e.inizio}–${e.fine}${e.pausa?` · pausa ${e.pausa} min`:""}`:"";
  return `<button type="button" class="entry" data-act="edit-entry" data-id="${esc(e.id)}" aria-label="${esc(fmtLong(e.data)+", "+(p?p.nome:"senza esperienza")+", "+fmtH(e.ore)+" ore")}">
  <span class="e-date"><span class="e-day mono">${d.getDate()}</span><span class="${showMonth?"e-mon":"e-wd"}">${esc(showMonth?mon:wd)}</span>${showMonth?`<span class="e-wd">${d.getFullYear()}</span>`:""}</span>
  <span class="e-body">
    <span class="e-top"><span class="dot c${p?p.colore:"x"}"></span><span class="e-proj">${esc(p?p.nome:"Senza esperienza")}</span><span class="e-h mono">${fmtH(e.ore)} h</span></span>
    ${time||e.modalita?`<span class="e-meta">${esc([time,MOD[e.modalita]].filter(Boolean).join(" · "))}</span>`:""}
    ${e.attivita?`<span class="e-text">${esc(e.attivita)}</span>`:""}
    <span class="e-foot"><span class="chips">${comps.slice(0,3).map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${comps.length>3?`<span class="chip">+${comps.length-3}</span>`:""}</span>${e.vidimato?`<span class="stamp">Vidimato</span>`:`<span class="pill todo">Da vidimare</span>`}</span>
  </span></button>`;
}

/* ----- riepilogo ----- */
function vRiepilogo(){
  const st=cur(),m=meta(),P=m.profile;
  if(!demo&&!m.started&&st.entries.length===0)return vWelcome();
  const s=stats(st);const goal=goalOf(P);const scale=Math.max(goal,s.tot,1);
  const segs=ANNI.filter(([k])=>s.byAnno[k]>0);
  const remain=goal?round2(goal-s.tot):null;
  const pct=goal?Math.min(100,Math.round(s.tot/goal*100)):0;
  let out=`<section class="progress quad" aria-label="Ore svolte">
    <div class="pg-top">
      <div><p class="eyebrow">Ore svolte nel triennio</p><p class="pg-num">${fmtH(s.tot)}<small>${goal?"/ "+goal+" h":"h"}</small></p></div>
      <div class="pg-side">${goal?(remain>0?`<p class="pg-rem">Mancano <span class="mono">${fmtH(remain)}</span> ore</p>`:`<p class="pg-rem done">Minimo raggiunto${remain<0?` · <span class="mono">+${fmtH(-remain)}</span> h`:""}</p>`):`<p class="pg-rem">Imposta il minimo di ore nel profilo</p>`}
      <p class="hint">${goal?`${esc((SCUOLE[P.scuola]||SCUOLE.altro)[0])}: almeno ${goal} ore nel triennio per l'ammissione all'esame${goal?` · ${pct}%`:""}`:""}</p></div>
    </div>
    <div class="segbar" role="img" aria-label="${esc(segs.map(([k,l])=>l+" "+fmtH(s.byAnno[k])+" ore").join(", ")||"Nessuna ora registrata")}">
      <div class="seg-in">${segs.map(([k,l,c])=>`<span style="width:${(s.byAnno[k]/scale*100).toFixed(2)}%;background:var(${c})"></span>`).join("")}</div>
      ${goal&&s.tot>goal?`<i class="goal" style="left:${(goal/scale*100).toFixed(2)}%" title="Minimo: ${goal} ore"></i>`:""}
    </div>
    ${segs.length?`<ul class="legend">${segs.map(([k,l,c])=>`<li><span class="sw" style="--c:var(${c})"></span>${k==="x"?l:"Classe "+l} <b>${fmtH(s.byAnno[k])} h</b></li>`).join("")}${s.vid<s.tot?`<li>Confermate dal tutor <b>${fmtH(s.vid)} h</b></li>`:""}${certTot(P)!=null?`<li>Certificate dalla scuola <b>${fmtH(certTot(P))} h</b></li>`:""}</ul>`:""}
  </section>
  <section class="panel kpis" aria-label="In sintesi">
    <div class="kpi"><b>${s.n}</b><span>${plural(s.n,"giornata","giornate")} registrate</span></div>
    <div class="kpi"><b>${m.projects.length}</b><span>${plural(m.projects.length,"esperienza","esperienze")}</span></div>
    <div class="kpi${s.nonVid?" warn":""}"><b>${s.nonVid}</b><span>da far vidimare</span></div>
    <div class="kpi"><b>${s.avg?s.avg.toFixed(1).replace(".",","):"–"}</b><span>giudizio medio su 5</span></div>
  </section>`;
  if(!m.projects.length){
    out+=`<section class="panel empty"><h2 class="h2">Da dove iniziare</h2><p>Ogni giornata appartiene a un'esperienza: un percorso del catalogo della scuola, un corso, uno stage. Aggiungi la prima e poi registra le giornate.</p><div class="btnrow"><button type="button" class="btn primary" data-act="go" data-to="esperienze" data-anchor="catalogo">Apri il catalogo del ${esc(SCHOOL.breve)}</button><button type="button" class="btn" data-act="new-project">Nuova esperienza</button></div></section>`;
  }
  out+=`<div class="grid2">
    <section class="panel"><div class="h2-row"><h2 class="h2">Ore per mese</h2><span class="hint">ultimi 12 mesi</span></div>${chartMonths(st)}</section>
    <section class="panel"><h2 class="h2">Esperienze</h2>${projMini(st,s)}</section>
    <section class="panel"><h2 class="h2">Competenze più allenate</h2>${compBars(s)}</section>
    <section class="panel"><h2 class="h2">Da sistemare</h2>${todoList(st,s)}</section>
  </div>`;
  const last=st.entries.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,3);
  if(last.length)out+=`<section class="panel"><div class="h2-row"><h2 class="h2">Ultime giornate</h2><a class="btn ghost small" href="#registro">Tutto il registro</a></div><div class="entries">${last.map(e=>entryRow(e,s.pmap,true)).join("")}</div></section>`;
  return out;
}
function certTot(P){const v=["3","4","5"].map(k=>String(P["cert"+k]==null?"":P["cert"+k]).trim()).filter(x=>x&&isFinite(parseNum(x)));return v.length?round2(sum(v.map(parseNum))):null;}
function chartMonths(st){
  const ser=monthSeries(st);const mx=Math.max(0,...ser.map(d=>d.v));
  if(!mx)return `<p class="hint">Il grafico si riempie man mano che registri le giornate.</p>`;
  const top=niceMax(mx);const iMax=ser.findIndex(d=>d.v===mx);
  const mlabel=d=>new Date(d.y,d.m-1,1).toLocaleDateString("it-IT",{month:"short"}).replace(".","");
  const mlong=d=>new Date(d.y,d.m-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  return `<div role="img" aria-label="Ore per mese: ${esc(ser.filter(d=>d.v).map(d=>mlong(d)+" "+fmtH(d.v)+" ore").join(", "))}">
  <div class="mplot">
    ${[top,top/2,0].map(v=>`<div class="gl" style="bottom:${(v/top*100).toFixed(2)}%"><span class="mono">${fmtH(v)}</span></div>`).join("")}
    <div class="mbars">${ser.map((d,i)=>{const h=(d.v/top*100).toFixed(2);return `<div class="mcol${i<2?" edge-l":i>9?" edge-r":""}" tabindex="${d.v?0:-1}" style="--bh:${h}%">${d.v?`<span class="mtip">${esc(mlong(d))}: ${fmtH(d.v)} h</span>`:""}${i===iMax?`<span class="mmax mono">${fmtH(d.v)}</span>`:""}<span class="mbar" style="height:${d.v?h:0}%"></span></div>`;}).join("")}</div>
  </div>
  <div class="mlabels" aria-hidden="true">${ser.map((d,i)=>`<span>${esc(mlabel(d))}${(i===0||d.m===1)?`<i>${d.y}</i>`:""}</span>`).join("")}</div></div>`;
}
function projMini(st,s){
  const ps=projSorted(s.m);
  if(!ps.length)return `<p class="hint">Nessuna esperienza ancora.</p>`;
  return `<ul class="pl">${ps.map(p=>{const o=s.byProj.get(p.id)||0;const prev=p.previste||0;const w=prev?Math.min(100,o/prev*100):(o?100:0);
    return `<li><div class="row"><span class="dot c${p.colore}"></span><span class="n">${esc(p.nome)}</span><span class="h">${fmtH(o)}${prev?" / "+fmtH(prev):""} h</span></div><div class="track c${p.colore}" style="--c:var(--p${p.colore})"><span style="width:${w.toFixed(1)}%"></span></div></li>`;}).join("")}</ul>`;
}
function compBars(s){
  const top=s.comp.slice(0,6);
  if(!top.length)return `<p class="hint">Quando segni le competenze nelle giornate, qui vedi quelle che alleni di più.</p>`;
  const mx=top[0][1];
  return `<ul class="bars">${top.map(([c,n])=>`<li><span class="lbl">${esc(c)}</span><span class="val">${n} ${plural(n,"giornata","giornate")}</span><span class="track"><span style="width:${(n/mx*100).toFixed(1)}%"></span></span></li>`).join("")}</ul>`;
}
function todoList(st,s){
  const m=s.m,P=m.profile;const items=[];
  if(!P.nome||!P.classe)items.push(["Completa il profilo con nome e classe","profilo"]);
  if(!m.projects.some(p=>p.tipo==="sicurezza"))items.push(["Manca il corso sulla sicurezza (4 ore, obbligatorio in 3ª)","esperienze","catalogo"]);
  if(s.nonVid)items.push([`${s.nonVid} ${plural(s.nonVid,"giornata","giornate")} da far firmare al tutor`,"registro","","todo"]);
  const noComp=st.entries.filter(e=>!e.competenze.length).length;
  if(noComp)items.push([`${noComp} ${plural(noComp,"giornata","giornate")} senza competenze segnate`,"registro"]);
  const today=todayISO();const ended=p=>!!p.fine&&p.fine<today;
  const noPatto=m.projects.filter(p=>(s.nProj.get(p.id)||0)>0&&!p.patto&&p.tipo!=="sicurezza");
  if(noPatto.length)items.push([`Patto formativo firmato da consegnare per ${listIt(noPatto.map(p=>p.nome))}`,"esperienze"]);
  const low=m.projects.filter(p=>ended(p)&&p.previste>0&&(s.byProj.get(p.id)||0)<p.previste*0.75);
  if(low.length)items.push([`Sotto i tre quarti delle ore previste: ${listIt(low.map(p=>p.nome))}`,"esperienze"]);
  const noCert=m.projects.filter(p=>ended(p)&&(s.nProj.get(p.id)||0)>0&&!p.cert);
  if(noCert.length)items.push([`Certificazione delle competenze da ricevere per ${listIt(noCert.map(p=>p.nome))}`,"esperienze"]);
  ["3","4","5"].forEach(k=>{const raw=String(P["cert"+k]==null?"":P["cert"+k]).trim();const c=parseNum(raw);if(raw&&isFinite(c)&&Math.abs(c-s.byAnno[k])>=0.5)items.push([`In ${k}ª il diario conta ${fmtH(s.byAnno[k])} h, la scuola ne ha certificate ${fmtH(c)}: controlla con il coordinatore`,"profilo","cert"]);});
  const noTut=m.projects.filter(p=>p.tipo==="stage"&&!p.tutorAz);
  if(noTut.length)items.push([`Aggiungi il tutor formativo esterno a ${noTut.map(p=>p.nome).join(", ")}`,"esperienze"]);
  const secs=m.report.sections||{};const empty=SECTIONS.filter(x=>!(secs[x.key]||"").trim()).length;
  const todos=SECTIONS.reduce((a,x)=>a+((secs[x.key]||"").match(/\[Completa:/g)||[]).length,0);
  if(st.entries.length&&empty===SECTIONS.length)items.push(["Relazione finale da iniziare","relazione"]);
  else if(empty||todos)items.push([`Relazione: ${empty?empty+" "+plural(empty,"sezione vuota","sezioni vuote"):""}${empty&&todos?" e ":""}${todos?todos+" "+plural(todos,"parte da completare","parti da completare"):""}`,"relazione"]);
  if(!items.length)return `<ul class="todo"><li><span class="mk ok" aria-hidden="true">✓</span><span class="t">Tutto in ordine.</span></li></ul>`;
  return `<ul class="todo">${items.map(([t,to,anchor,f])=>`<li><span class="mk warn" aria-hidden="true">!</span><span class="t">${esc(t)}</span><button type="button" class="btn ghost small" data-act="go" data-to="${to}"${anchor?` data-anchor="${anchor}"`:""}${f?` data-todo="1"`:""}>Apri</button></li>`).join("")}</ul>`;
}

/* ----- registro ----- */
let filt={q:"",p:"",anno:"",todo:false};
function vRegistro(){
  const st=cur(),m=meta();
  if(!st.entries.length){
    return `<section class="panel empty"><h2 class="h2">Il registro è vuoto</h2><p>Registra ogni giornata appena finisce: data, orario, che cosa hai fatto e quali competenze hai usato. A fine anno avrai già tutto per la relazione e per il foglio presenze.</p><div class="btnrow">${m.projects.length?`<button type="button" class="btn primary" data-act="new-entry">Registra la prima giornata</button>`:`<button type="button" class="btn primary" data-act="go" data-to="esperienze" data-anchor="catalogo">Prima aggiungi un'esperienza</button>`}</div></section>`;
  }
  return `<section class="panel toolbar" aria-label="Filtri">
    <div class="tb-row"><label class="search" style="flex:1 1 100%"><span class="sr">Cerca nel registro</span><input class="in" type="search" id="f-q" placeholder="Cerca nelle attività, nelle note, nelle competenze…" value="${esc(filt.q)}"></label></div>
    <div class="tb-row">
      <label class="sr" for="f-p">Esperienza</label><select class="in" id="f-p"><option value="">Tutte le esperienze</option>${projSorted(m).map(p=>`<option value="${esc(p.id)}" ${filt.p===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}</select>
      <label class="sr" for="f-anno">Classe</label><select class="in" id="f-anno"><option value="">Tutte le classi</option>${["3","4","5"].map(a=>`<option value="${a}" ${filt.anno===a?"selected":""}>Classe ${a}ª</option>`).join("")}</select>
      <button type="button" class="tchip" id="f-todo" data-act="f-todo" aria-pressed="${filt.todo}">Solo da vidimare</button>
    </div>
    <div class="tb-row"><span class="tb-sum mono" id="f-sum"></span><span class="grow"></span><button type="button" class="btn small" data-act="presenze-pdf">Foglio presenze PDF</button><button type="button" class="btn small" data-act="csv">Esporta per Excel</button></div>
  </section>
  <div id="reg-list" class="entries"></div>`;
}
function filteredEntries(){
  const st=cur(),pmap=new Map(meta().projects.map(p=>[p.id,p]));const q=filt.q.trim().toLowerCase();
  return st.entries.filter(e=>{
    if(filt.p&&e.projectId!==filt.p)return false;
    if(filt.anno){const p=pmap.get(e.projectId);if(!p||String(p.anno)!==filt.anno)return false;}
    if(filt.todo&&e.vidimato)return false;
    if(q){const p=pmap.get(e.projectId);const hay=[e.attivita,e.imparato,e.difficolta,e.competenze.join(" "),p?p.nome:"",p?p.ente:""].join(" ").toLowerCase();if(!hay.includes(q))return false;}
    return true;
  }).sort((a,b)=>b.data.localeCompare(a.data)||String(b.inizio).localeCompare(String(a.inizio)));
}
function renderRegList(){
  const list=$("#reg-list");if(!list)return;
  const es=filteredEntries();const pmap=new Map(meta().projects.map(p=>[p.id,p]));
  const sumEl=$("#f-sum");if(sumEl)sumEl.textContent=`${es.length} ${plural(es.length,"giornata","giornate")} · ${fmtH(sum(es.map(e=>e.ore)))} h`;
  if(!es.length){list.innerHTML=`<p class="hint" style="padding:8px 4px">Nessuna giornata con questi filtri.</p>`;return;}
  let html="",curM="";
  const groups=new Map();for(const e of es){const k=e.data.slice(0,7);groups.set(k,(groups.get(k)||0)+e.ore);}
  for(const e of es){const k=e.data.slice(0,7);if(k!==curM){curM=k;html+=`<div class="mhead"><span>${esc(toD(e.data).toLocaleDateString("it-IT",{month:"long",year:"numeric"}))}</span><span class="mono">${fmtH(groups.get(k))} h</span></div>`;}html+=entryRow(e,pmap,false);}
  list.innerHTML=html;
}

/* ----- esperienze ----- */
let catAs="2026/27",catQ="";
function vEsperienze(){
  const st=cur(),m=meta(),s=stats(st);const ps=projSorted(m);
  let out=`<div class="h2-row" style="margin:0"><h2 class="h2" style="font-size:22px">Le mie esperienze</h2><button type="button" class="btn primary" data-act="new-project">+ Nuova esperienza</button></div>`;
  if(!ps.length)out+=`<section class="panel empty"><p>Non hai ancora esperienze. Scegline una dal catalogo qui sotto oppure creane una nuova (uno stage estivo, un corso esterno, un'attività di orientamento).</p></section>`;
  for(const a of [3,4,5]){
    const g=ps.filter(p=>p.anno===a);if(!g.length)continue;
    const ore=sum(g.map(p=>s.byProj.get(p.id)||0));
    out+=`<div class="group-h"><h2>Classe ${a}ª</h2><span class="mono">${fmtH(ore)} h</span></div><div class="proj-list">${g.map(p=>projCard(p,s)).join("")}</div>`;
  }
  if(s.byProj.get("_"))out+=`<p class="notice">${s.nProj.get("_")} ${plural(s.nProj.get("_"),"giornata non è collegata","giornate non sono collegate")} a nessuna esperienza (${fmtH(s.byProj.get("_"))} h). Aprile dal registro e scegli l'esperienza giusta.</p>`;
  out+=`<section class="panel" id="catalogo">
    <div class="h2-row"><h2 class="h2">Catalogo del ${esc(SCHOOL.breve)}</h2><a class="btn ghost small" href="${esc(SCHOOL.url)}" target="_blank" rel="noopener">Pagina della scuola ↗</a></div>
    <p class="hint" style="margin:-6px 0 12px">Percorsi pubblicati sul sito della scuola, letti il ${CAT_DATE}. Per candidarti segui la circolare del percorso; qui lo aggiungi al diario quando inizi a frequentarlo.</p>
    <div class="cat-tools"><label class="sr" for="cat-as">Anno scolastico</label><select class="in" id="cat-as">${["2026/27","2025/26"].map(a=>`<option value="${a}" ${catAs===a?"selected":""}>a.s. ${a}</option>`).join("")}</select><label class="sr" for="cat-q">Cerca nel catalogo</label><input class="in" type="search" id="cat-q" placeholder="Cerca un percorso o un ente…" value="${esc(catQ)}"></div>
    <div id="cat-list"></div>
  </section>`;
  return out;
}
function projCard(p,s){
  const o=s.byProj.get(p.id)||0,n=s.nProj.get(p.id)||0,prev=p.previste||0;
  const w=prev?Math.min(100,o/prev*100):(o?100:0);

function guessAnno(dest){
  const P=meta().profile;const cl=parseInt(String(P.classe||"").match(/[345]/)?.[0]||"0",10);
  const ds=String(dest||"");const inDest=[3,4,5].filter(a=>ds.includes(a+"ª")||ds.includes(a+"A")||ds.includes(a+"B")||ds.includes(a+"C")||ds.includes(a+"D")||ds.includes(a+"E")||ds.includes(a+"G")||ds.includes(a+"N"));
  if(inDest.length===1)return inDest[0];
  if(cl&&(!inDest.length||inDest.includes(cl)))return cl;
  return inDest[0]||cl||3;
}

}

/* ---------- avvisi ---------- */
let toastTimer=0;
function toast(msg,actLabel,actFn,ms){
  const t=$("#toast");t.innerHTML="";const s=document.createElement("span");s.textContent=msg;t.appendChild(s);
  if(actLabel&&actFn){const b=document.createElement("button");b.type="button";b.textContent=actLabel;b.addEventListener("click",()=>{t.classList.remove("show");actFn();});t.appendChild(b);}
  t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),ms||(actLabel?7000:3600));
}

/* ---------- bozza della relazione ---------- */
function buildDraft(st){
  const m=st.meta||blankMeta(),P=m.profile,s=stats(st),goal=goalOf(P);
  const ps=projSorted(m).filter(p=>(s.byProj.get(p.id)||0)>0);
  const all=st.entries.slice().sort((a,b)=>a.data.localeCompare(b.data));
  const TP={stage:"stage",corso:"corsi e laboratori",project:"project work",sicurezza:"formazione sulla sicurezza",orientamento:"orientamento",volontariato:"volontariato",ifs:"impresa formativa simulata",estero:"esperienze all'estero",altro:"altre attività"};
  const tipi=[...new Set(ps.map(p=>TP[p.tipo]).filter(Boolean))];
  const nome=P.nome||"[Completa: nome e cognome]";
  const out={};
  out.intro=`Mi chiamo ${nome} e frequento la classe ${P.classe||"[Completa: classe]"}${P.indirizzo?`, indirizzo ${P.indirizzo},`:""} ${P.istituto?(/^[aeiouAEIOU]/.test(P.istituto)?"all'":"al ")+P.istituto:"[Completa: scuola]"}. Nel triennio ho partecipato a ${ps.length} ${plural(ps.length,"esperienza","esperienze")} di formazione scuola-lavoro (ex PCTO), per un totale di ${fmtH(s.tot)} ore${goal?` su un minimo di ${goal} previsto per il mio percorso`:""}.${tipi.length>1?` Ho svolto attività di diverso tipo (${tipi.join(", ")}).`:""}\n\nIn questa relazione, che entra nel mio portfolio e che presento al colloquio dell'esame di Stato, racconto che cosa ho fatto, quali competenze ho sviluppato e come queste esperienze hanno influito sulle mie scelte per il futuro.`;
  out.esperienze=ps.length?ps.map(p=>{
    const es=entriesOf(st,p.id);const ore=s.byProj.get(p.id)||0;
    const per=fmtRange(p.inizio||(es[0]||{}).data,p.fine||(es[es.length-1]||{}).data);
    const acts=[...new Set(es.map(e=>lcFirst(firstSentence(e.attivita))).filter(Boolean))].slice(0,3);
    const dif=es.find(e=>e.difficolta);
    const cap=x=>x?x[0].toUpperCase()+x.slice(1):x;
    const sede=p.sede==="Online"?" online":/^A /.test(p.sede||"")?" "+p.sede[0].toLowerCase()+p.sede.slice(1):p.sede?" a "+p.sede:"";
    let t=`${p.nome}, ${[p.ente,"classe "+p.anno+"ª",p.as?"a.s. "+p.as:""].filter(Boolean).join(", ")}. `;
    t+=`${per?cap(per)+" ho":"Ho"} svolto ${fmtH(ore)} ore${sede}${p.tutorAz?"; tutor esterno: "+p.tutorAz:""}.`;
    if(p.descr)t+=" "+p.descr.replace(/\s*Percorso( n\. \d+)? del catalogo FSL[^.]*\./,"").trim();
    if(acts.length)t+=` Le attività principali: ${acts.join("; ")}.`;
    if(dif)t+=` Una difficoltà che ho incontrato: ${lcFirst(firstSentence(dif.difficolta))}.`;
    return t.replace(/\s+\./g,".").replace(/\.\./g,".").trim();
  }).join("\n\n"):"[Completa: descrivi le esperienze svolte. Registra le giornate nel diario per avere una bozza automatica.]";
  const top=s.comp.slice(0,3);
  const used=new Set();const ex=(pred,n)=>{const r=all.filter(e=>e.imparato&&!used.has(e.id)&&e.competenze.some(pred)).slice(0,n);r.forEach(e=>used.add(e.id));return r.map(e=>"«"+firstSentence(e.imparato)+"»");};
  const tech=ex(c=>TECNICHE.has(c),2),soft=ex(c=>!TECNICHE.has(c),2);
  out.competenze=top.length?`Le competenze che ho allenato più spesso sono ${listIt(top.map(([c,n])=>`${c.toLowerCase()} (${n} ${plural(n,"giornata","giornate")})`))}.${tech.length?`\n\nSul piano delle competenze tecniche, ecco che cosa ho annotato nel diario: ${tech.join("; ")}.`:""}${soft.length?`\n\nTra le competenze trasversali: ${soft.join("; ")}.`:""}\n\n[Completa: scegli l'esempio che ti rappresenta di più e racconta in due righe che cosa sai fare oggi che prima non sapevi fare.]`:"[Completa: segna le competenze nelle giornate del diario oppure descrivi qui le competenze tecniche e trasversali che hai sviluppato.]";
  const mat=splitMat(P.materie);
  const hasSic=ps.some(p=>p.tipo==="sicurezza");const civ=ps.filter(p=>(p.materie||[]).includes("Educazione civica")||p.tipo==="volontariato"||all.some(e=>e.projectId===p.id&&e.competenze.includes("Cittadinanza attiva"))).map(p=>p.nome);
  const civOther=civ.filter(x=>!/sicurezza/i.test(x));
  const matLines=mat.filter(x=>x!=="Educazione civica").map(x=>{const pp=ps.filter(p=>(p.materie||[]).includes(x));return pp.length?`${x}: ${listIt(pp.map(p=>p.nome))}. [Completa: collega l'esperienza a un argomento preciso del programma di ${x.toLowerCase()}.]`:`${x}: [Completa: cerca un collegamento reale con le esperienze; se non c'è, non forzarlo.]`;});
  out.collegamenti=`${mat.length?`Le materie del mio colloquio sono ${listIt(mat)}.\n\n${matLines.join("\n\n")}`:"[Completa: indica le materie del colloquio nel profilo.]"}${hasSic||civOther.length?"\n\n":""}${hasSic?`Per l'Educazione civica, il corso sulla sicurezza mi ha fatto conoscere il D.Lgs. 81/2008 e i diritti e i doveri dei lavoratori, compresi quelli degli studenti in formazione.`:""}${civOther.length?`${hasSic?" Anche":"Per l'Educazione civica,"} ${listIt(civOther)} ${civOther.length===1?"si collega":"si collegano"} ai temi della cittadinanza attiva.`:""}`;
  const pv=ps.map(p=>{const es=entriesOf(st,p.id).filter(e=>e.voto);return{p,avg:es.length?sum(es.map(e=>e.voto))/es.length:0};}).filter(x=>x.avg).sort((a,b)=>b.avg-a.avg);

function applyImport(mode){

  if(demo){demo=null;}

  if(mode==="replace"||!real.meta){

    real.meta=inMeta;saveMeta();old.forEach(dropEntry);inE.forEach(putEntry);
  }else{

    for(const k in inMeta.profile)if(!m.profile[k]&&inMeta.profile[k])m.profile[k]=inMeta.profile[k];

function aiErr(e){
  const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){document.body.classList.remove("has-ai");capSample=null;return "Claude non è disponibile in questa pagina.";}
  if(c==="rate_limited")return "Troppe richieste a Claude: riprova tra qualche minuto.";
  if(c==="session_expired")return "Accedi di nuovo a Claude e riprova.";
  if(c==="refused")return "Claude non ha completato la richiesta. Modifica il testo e riprova.";
  if(c==="prompt_too_large")return "Il diario è troppo lungo per una richiesta sola: migliora una sezione alla volta.";
  if(c==="invalid_json"||c==="empty_completion")return "La risposta non era completa. Riprova.";
  return "Connessione interrotta. Riprova.";
}
function digest(max){
  const st=cur(),m=meta(),P=m.profile,s=stats(st),goal=goalOf(P);const L=[];
  L.push(`Studente: ${P.nome||"(nome non indicato)"}; classe ${P.classe||"?"}; indirizzo ${P.indirizzo||"?"}; scuola ${P.istituto||"?"} (${(SCUOLE[P.scuola]||SCUOLE.altro)[0]}); minimo ore nel triennio ${goal||"?"}; ore svolte ${fmtH(s.tot)}.`);
  if(P.materie)L.push(`Materie del colloquio: ${P.materie}.`);
  projSorted(m).forEach(p=>{const es=entriesOf(st,p.id);
    L.push(`\nESPERIENZA: ${p.nome} | tipo: ${TIPO[p.tipo]||""} | ente: ${p.ente||"-"} | sede: ${p.sede||"-"} | settore: ${p.settore||"-"} | classe ${p.anno}ª | a.s. ${p.as||"-"} | periodo: ${fmtRange(p.inizio||(es[0]||{}).data,p.fine||(es[es.length-1]||{}).data)||"-"} | fase: ${p.fase||"-"} | materie collegate: ${p.materie.join(", ")||"-"} | tutor formativo esterno: ${p.tutorAz||"-"} | ore previste: ${p.previste||"-"} | ore svolte: ${fmtH(s.byProj.get(p.id)||0)} | descrizione: ${p.descr||"-"}`);
    es.forEach(e=>L.push(`- ${e.data} (${fmtH(e.ore)} h, ${MOD[e.modalita]||""}, giudizio ${e.voto||"-"}/5): attività: ${e.attivita} | competenze: ${e.competenze.join(", ")||"-"} | imparato: ${e.imparato||"-"} | difficoltà: ${e.difficolta||"-"}`));});
  let t=L.join("\n");if(t.length>(max||20000))t=t.slice(0,max||20000)+"\n[…diario troncato]";
  return t;
}
const AI_RULES=`Scrivi in prima persona, in italiano corretto e naturale, con il tono di uno studente di 17-19 anni: chiaro e concreto, senza frasi fatte né esagerazioni. Usa SOLO i fatti presenti nel diario. Non inventare enti, date, numeri, strumenti o risultati. Dove manca un'informazione che serve (per esempio le scelte dopo il diploma o i collegamenti con le materie), inserisci un segnaposto nella forma [Completa: …] che dica allo studente che cosa scrivere. Niente markdown, niente titoli, niente elenchi puntati; separa i paragrafi con una riga vuota.`;

const CFG=window.DIARIO_CONFIG||{};
const SB_ON=STANDALONE&&!!(CFG.supabaseUrl&&CFG.supabaseKey);
const PAGE_URL=location.origin+location.pathname;
const sbs={client:null,uid:null,timer:0,retry:0,pending:false,saving:false,again:false,lastRemote:null,warned:false};
let sbMode="login",sbEmail="",sbMsg=null;
async function sbBoot(){
  try{await loadLib("supabase");}catch(e){}
  if(!(window.supabase&&window.supabase.createClient)){goLocal(false);toast("Non riesco a raggiungere il servizio di accesso: per ora il diario si salva in questo browser.");return;}
  try{sbs.client=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}
  catch(e){goLocal(false);toast("La configurazione di Supabase in config.js non è valida.");return;}
  sbs.client.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>sbAuthEvent(ev,session),0);});
  let session=null;
  try{const r=await sbs.client.auth.getSession();session=r&&r.data&&r.data.session;}catch(e){}
  if(session&&session.user)sbStart(session.user);
  else if(!sbs.uid){store.mode="locked";render();}
}
function sbAuthEvent(ev,session){
  if(ev==="PASSWORD_RECOVERY")openNewPassword(true);
  if(session&&session.user){if(sbs.uid!==session.user.id)sbStart(session.user);}
  else if(sbs.uid||ev==="SIGNED_OUT")sbStopped();
}
async function sbStart(user){
  sbs.uid=user.id;account={id:user.id,email:user.email||"",name:""};
  LKEY=LEGACY_KEY+":sb:"+user.id;
  store.mode="sb";store.ready=false;sbMsg=null;setStatus("loading");
  const cached=readLocal();
  if(cached){real=cached;store.ready=true;}
  render();
  const r=await sbFetch();
  if(sbs.uid!==user.id)return;
  if(r===false){if(!store.ready){real={meta:null,entries:[]};store.ready=true;}setStatus("offline");render();toast("Non riesco a scaricare il diario: lavoro sulla copia di questo dispositivo e la carico appena torna la connessione.");return;}
  if(r){real=r;try{localStorage.setItem(LKEY,JSON.stringify(real));}catch(e){}}
  else if(!cached)real={meta:null,entries:[]};
  store.ready=true;setStatus("cloud");render();
  if(!r)sbOfferLegacy();
}
async function sbFetch(){
  try{
    const {data,error}=await sbs.client.from("diari").select("data,updated_at").eq("user_id",sbs.uid).maybeSingle();
    if(error)throw error;
    if(!data)return null;
    sbs.lastRemote=data.updated_at;
    const d=data.data||{};
    return{meta:normMeta(d.meta),entries:Array.isArray(d.entries)?d.entries.map(normEntry).filter(e=>e.id):[]};
  }catch(e){console.warn("Supabase:",e);return false;}
}
function sbSave(){
  try{localStorage.setItem(LKEY,JSON.stringify(real));}catch(e){}
  sbs.pending=true;setStatus("saving");clearTimeout(sbs.timer);sbs.timer=setTimeout(sbFlush,900);
}
async function sbFlush(){
  clearTimeout(sbs.timer);
  if(!sbs.client||!sbs.uid)return;
  if(sbs.saving){sbs.again=true;return;}
  sbs.saving=true;sbs.pending=false;
  const now=new Date().toISOString();const uid=sbs.uid;
  let error=null;
  try{const r=await sbs.client.from("diari").upsert({user_id:uid,data:real,updated_at:now});error=r.error;}catch(e){error=e;}
  sbs.saving=false;
  if(uid!==sbs.uid)return;
  if(error){
    console.warn("Supabase:",error);sbs.pending=true;setStatus("offline");
    if(!sbs.warned){sbs.warned=true;toast("Salvataggio online non riuscito: il diario resta su questo dispositivo e riprovo da solo.");}
    clearTimeout(sbs.retry);sbs.retry=setTimeout(()=>{if(sbs.pending)sbFlush();},20000);
  }else{sbs.lastRemote=now;sbs.warned=false;if(!sbs.pending)setStatus("cloud");}
  if(sbs.again){sbs.again=false;sbFlush();}
}
function sbStopped(){
  clearTimeout(sbs.timer);clearTimeout(sbs.retry);
  try{if(LKEY!==LEGACY_KEY)localStorage.removeItem(LKEY);}catch(e){}
  sbs.uid=null;sbs.pending=false;account=null;demo=null;real={meta:null,entries:[]};LKEY=LEGACY_KEY;
  store.mode="locked";store.ready=false;reportUndo=null;filt={q:"",p:"",anno:"",todo:false};
  closeSheet();render();
}
async function sbLogout(){
  if(!sbs.client)return;
  if(sbs.pending||sbs.saving){toast("Salvo le ultime modifiche…");await sbFlush();for(let i=0;i<20&&sbs.saving;i++)await sleep(150);}
  try{await sbs.client.auth.signOut();}catch(e){}
  if(sbs.uid)sbStopped();
  toast("Sei uscito dall'account.");
}
function sbOfferLegacy(){
  let loc=null;try{const r=localStorage.getItem(LEGACY_KEY);if(r)loc=JSON.parse(r);}catch(e){}
  if(!loc||!Array.isArray(loc.entries)||!loc.entries.length)return;
  toast(`In questo browser c'è un diario salvato senza account (${loc.entries.length} ${plural(loc.entries.length,"giornata","giornate")}).`,"Portalo nel tuo account",()=>{
    real={meta:normMeta(loc.meta),entries:loc.entries.map(normEntry).filter(e=>e.id)};sbSave();
    try{localStorage.removeItem(LEGACY_KEY);}catch(e){}render();toast("Diario copiato nel tuo account.");},12000);
}
document.addEventListener("visibilitychange",async()=>{
  if(store.mode!=="sb"||!sbs.uid)return;
  if(document.visibilityState==="hidden"){if(sbs.pending)sbFlush();return;}
  if(sbs.pending||sbs.saving)return;
  const before=sbs.lastRemote;const r=await sbFetch();
  if(r&&sbs.lastRemote!==before&&!sbs.pending&&!sbs.saving){real=r;try{localStorage.setItem(LKEY,JSON.stringify(real));}catch(e){}softRender();}
});
window.addEventListener("online",()=>{if(store.mode==="sb"&&sbs.pending)sbFlush();});

function sbSay(t,m){sbMsg={t,m};if(store.mode==="locked"&&!demo){const em=$("#sb-email");if(em)sbEmail=em.value;render();}else toast(m);}
function sbErr(e){
  const c=e&&e.code;const m=String((e&&(e.message||e.error_description))||"").toLowerCase();
  if(c==="invalid_credentials"||m.includes("invalid login"))return "Email o password non corretti.";
  if(c==="email_not_confirmed"||m.includes("not confirmed"))return "Prima conferma l'account con il link che ti è arrivato per email.";
  if(c==="user_already_exists"||c==="email_exists"||m.includes("already registered"))return "Esiste già un account con questa email: scegli «Accedi».";
  if(c==="weak_password")return "La password è troppo debole: usane una più lunga.";
  if(c==="over_email_send_rate_limit"||m.includes("rate limit"))return "Sono state inviate troppe email in poco tempo: riprova più tardi, oppure accedi con email e password.";
  if(c==="email_address_not_authorized"||m.includes("not authorized"))return "Il sito non può ancora inviare email a questo indirizzo: accedi con email e password. Chi gestisce il sito può attivare l'invio delle email nelle impostazioni di Supabase.";
  if(c==="signup_disabled"||m.includes("signups not allowed"))return "Le nuove registrazioni sono chiuse.";
  if(c==="same_password")return "La nuova password deve essere diversa da quella attuale.";
  if(m.includes("fetch")||m.includes("network"))return "Non c'è connessione: riprova.";
  return "Non è andata: "+((e&&e.message)||"errore sconosciuto")+".";
}
const validEmail=x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x);

    if(sbMode==="signup"){

      if(error)throw error;
      if(!(data&&data.session))sbSay("ok",`Ti ho mandato un'email a ${email}: apri il link per confermare l'account, poi torna qui e accedi.`);
    }else{
      const {error}=await sbs.client.auth.signInWithPassword({email,password:pass});

    <div class="sheet-body"><label class="field"><span>Nuova password</span><input class="in" type="password" id="np-pass" autocomplete="new-password"></label><p class="hint">Almeno 6 caratteri.</p><p class="form-err" id="np-err" hidden></p></div>
    <div class="sheet-foot"><span class="grow"></span><button type="button" class="btn" data-close>Annulla</button><button type="submit" class="btn primary">Salva la password</button></div></form>`,"Nuova password",card=>{
    $("#np-form",card).addEventListener("submit",async ev=>{
      ev.preventDefault();const pw=$("#np-pass",card).value;const er=$("#np-err",card);
      if(pw.length<6){er.hidden=false;er.textContent="La password deve avere almeno 6 caratteri.";return;}
      try{const {error}=await sbs.client.auth.updateUser({password:pw});if(error)throw error;closeSheet();toast("Password aggiornata.");}
      catch(e){er.hidden=false;er.textContent=sbErr(e);}
    });
  });
}

/* ---------- avvio ---------- */
async function boot(){
  const h=location.hash.slice(1);view=VIEWS.includes(h)?h:"riepilogo";
  render();
  initCaps();
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}catch(e){}
  }
  if(STANDALONE){if(SB_ON)sbBoot();else goLocal(false);return;}
  let me=null;
  if(user){try{me=await user.me();}catch(e){}}
  if(!me||!(me.id||me.email)){store.mode="locked";setStatus("loading");$("#status").hidden=true;render();return;}
  account={id:me.id||null,email:me.email||"",name:me.name||""};
  LKEY=LEGACY_KEY+":"+(account.id||account.email.toLowerCase());
  try{if(!localStorage.getItem(LKEY)&&localStorage.getItem(LEGACY_KEY)){localStorage.setItem(LKEY,localStorage.getItem(LEGACY_KEY));localStorage.removeItem(LEGACY_KEY);}}catch(e){}
  if(db&&account.id)startCloud(db,account.id);else goLocal(false);
}
boot();
})();
</script>
